apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-ingress
  annotations:
    # Báo cho Nginx Ingress Controller biết để xử lý
    kubernetes.io/ingress.class: nginx
    # Kích hoạt Let's Encrypt tự động sinh chứng chỉ SSL (Yêu cầu đã cài cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Cấu hình timeout dài cho giao thức SSE
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # BẮT BUỘC để luồng SSE (Server-Sent Events) không bị kẹt trong buffer
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - mcp.ten-mien-cua-ban.com
    secretName: mcp-tls-secret
  rules:
  - host: mcp.ten-mien-cua-ban.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-service
            port:
              number: 80

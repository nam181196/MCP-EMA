<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Lấy Token Clerk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 50px;
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #app {
            margin-bottom: 20px;
        }

        .token-box {
            display: none;
            margin-top: 20px;
        }

        .token-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #059669;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-family: monospace;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            resize: vertical;
        }

        .hint {
            font-size: 14px;
            color: #6b7280;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>👋 Trình Tạo Token Demo (Clerk)</h1>

        <!-- Nơi Clerk render component Đăng nhập/User Button -->
        <div id="app"></div>

        <!-- Vùng hiển thị Token sau khi đăng nhập thành công -->
        <div id="token-box" class="token-box">
            <div class="token-header">🎉 Xác thực thành công! Đây là chuỗi Token (JWT) của bạn:</div>
            <textarea id="jwt-token" readonly></textarea>
            <div class="hint">Hãy copy toàn bộ chuỗi trên và dán vào phần "Authorization: Bearer <...>" của Claude.
            </div>
        </div>
    </div>

    <!-- Tải ClerkJS trực tiếp từ máy chủ Clerk (bản v5) để tránh Adblock -->
    <script 
        crossorigin="anonymous" 
        data-clerk-publishable-key="pk_test_bG9naWNhbC1ndXBweS0yMTg5LmNsZXJrLmFjY291bnRzLmRldiQ" 
        src="https://logical-guppy-2189.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <script>
        window.addEventListener("load", async function () {
            try {
                if (!window.Clerk) {
                    throw new Error("Thư viện Clerk không tải được. Hãy tắt trình chặn quảng cáo (AdBlock) hoặc thử dùng trình duyệt ẩn danh.");
                }

                await window.Clerk.load();

                const appDiv = document.getElementById("app");
                const tokenBox = document.getElementById("token-box");
                const jwtTextarea = document.getElementById("jwt-token");

                if (window.Clerk.user) {
                    // Nếu đã đăng nhập, hiển thị User Button
                    window.Clerk.mountUserButton(appDiv);

                    // Lấy token và in ra màn hình
                    const token = await window.Clerk.session.getToken();
                    jwtTextarea.value = token;
                    tokenBox.style.display = "block";
                    
                    // Thêm logic Device Flow (Universal Auth)
                    const urlParams = new URLSearchParams(window.location.search);
                    const sessionId = urlParams.get('session_id');
                    if (sessionId) {
                        document.querySelector(".hint").innerText = "Đang xác thực phiên đăng nhập cho AI, vui lòng đợi...";
                        
                        try {
                            const response = await fetch(`https://mcp-ema.onrender.com/auth`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    session_id: sessionId,
                                    token: token
                                })
                            });
                            const data = await response.json();
                            
                            if (response.ok) {
                                document.querySelector(".hint").innerHTML = `<span style="color:green; font-weight:bold;">${data.message}</span><br>Bạn có thể đóng trang web này và quay lại phần mềm AI.`;
                            } else {
                                document.querySelector(".hint").innerHTML = `<span style="color:red; font-weight:bold;">Lỗi: ${data.error}</span>`;
                            }
                        } catch (e) {
                            document.querySelector(".hint").innerHTML = `<span style="color:red; font-weight:bold;">Lỗi kết nối đến máy chủ AI: ${e.message}</span>`;
                        }
                    }
                } else {
                    // Nếu chưa đăng nhập, hiển thị khung SignIn
                    window.Clerk.mountSignIn(appDiv);
                }
            } catch (err) {
                console.error("Lỗi khởi tạo Clerk:", err);
                document.getElementById('app').innerHTML = "<p style='color:red;'>" + err.message + "</p>";
            }
        });
    </script>
</body>

</html>
